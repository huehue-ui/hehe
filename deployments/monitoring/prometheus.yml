global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'campaignservice'
    # Assuming campaignservice is resolvable on port 9091 (e.g., via Docker Compose network)
    # If running Prometheus locally and app locally: use 'localhost:9091'
    # If Prometheus is in Docker and app is on host: use 'host.docker.internal:9091'
    static_configs:
      - targets: ['campaignservice:9091'] # For Docker Compose setup
      # - targets: ['localhost:9091'] # For local setup if app runs on host
      # - targets: ['host.docker.internal:9091'] # For Prometheus in Docker, app on host
